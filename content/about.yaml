headline: |-
  A creative agency
  _built for_ what's *next.*
intro: >-
  Lovell Media is a global creative production and digital media agency. Known for high-quality
  photography and video, we now deliver complete projects: concept, production, post-production and
  digital execution.
story: >-
  Lovell Media built its reputation on visual production: campaigns, events and stories captured
  with care. Today we bring that same standard to creative development, social media and web, so
  clients can take a single service or the whole project through one team.
international: >-
  We work across international markets, coordinating crews, locations and deliverables so that a
  campaign looks as good in its tenth city as in its first.
principles:
  - title: Story first
    body: >-
      Every brief starts with the story. The format, the scale and the spectacle follow from what
      needs to be said.
  - title: Produced end to end
    body: >-
      Concept, planning, crew, shoot and post. We coordinate the moving parts so the work arrives
      whole.
  - title: Directed, not just filmed
    body: >-
      Creative decisions come first: the frame, the movement, the sound. Good footage is the
      minimum.
  - title: Quality over appearances
    body: We never sacrifice the quality of the work to look busy or bigger than we are.
leadership: []
