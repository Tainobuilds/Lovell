label: Global production
headline: |-
  One partner.
  *Every market.*
intro: >-
  Bring us an international production requirement and work with one central point of contact. We
  coordinate crews, locations and logistics so every market gets the same standard of work.
capabilities:
  - title: International photography and videography
    body: Production in the markets where your campaign runs.
  - title: Multicity and multicountry coverage
    body: One campaign documented across many locations, on the same schedule.
  - title: Local crew sourcing
    body: Photographers and videographers sourced locally, briefed by us.
  - title: Remote production coordination
    body: Shoots planned, briefed and directed from one central team.
  - title: International campaign logistics
    body: Permissions, timings, travel and kit, handled.
  - title: Consistent deliverables
    body: The same look, formats and turnaround in every market.
networkHeadline: The Lovell Media *Global Crew Network*
networkText: >-
  We are developing a network of trusted creative professionals around the world, so international
  projects can be staffed quickly and delivered to one standard.
