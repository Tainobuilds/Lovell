label: The director
headline: |-
  Latoya Lovell.
  *Director.*
intro: >-
  Latoya Lovell is an international filmmaker, creative director and the founder of Lovell Media.
  She turns real experiences into cinematic stories for brands, artists and audiences.
commercialsText: Campaigns and brand films directed to be noticed and remembered.
musicText: Concert films, music films and performance visuals that put you in the room.
narrativeText: Branded documentaries and stories drawn from real lives and real places.
approachHeadline: Every project starts with the *story.*
approachText: >-
  Then come the decisions that make it unmistakable: where the camera sits, how it moves, what we
  hear and what we leave out.
